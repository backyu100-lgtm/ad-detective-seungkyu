<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🕵️ 광고 탐정 승규 | 広告探偵スンギュ</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--sub:#6f6a62;--line:#e4dfd5;--acc:#3b2f8f;--acc2:#efeafc;
--a:#1f8a4c;--b:#b7791f;--c:#b23a3a;--win:#d4a017}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Pretendard","Noto Sans KR","Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:22px 24px 8px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:-.5px}h1 small{display:block;font-size:12px;color:var(--sub);font-weight:500;letter-spacing:1px}
.upd{margin-left:auto;color:var(--sub);font-size:12px}
.report{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.stat b{font-size:26px;display:block}.stat span{font-size:12px;color:var(--sub)}
.stat.win b{color:var(--win)}
.tabs{display:flex;gap:6px;padding:8px 24px 0}
.tab{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;font-size:13px}
.filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.count{font-size:12px;color:var(--sub);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:6px 24px 40px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .12s}
.ad:hover{transform:translateY(-2px)}
.thumb{aspect-ratio:4/5;background:#ddd center/cover no-repeat;position:relative}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.badge.win{background:var(--win);color:#1d1b18;font-weight:700}
.grade{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.gA{background:var(--a)}.gB{background:var(--b)}.gC{background:var(--c)}
.vid{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
.meta{padding:10px 12px}.blk{float:right;border:0;background:none;cursor:pointer;opacity:.35;font-size:13px;padding:0}.blk:hover{opacity:1}
.set{padding:6px 24px 40px;display:grid;gap:14px;max-width:920px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{margin:0 0 8px;font-size:15px}.panel p{margin:4px 0;font-size:12.5px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:#f1ede5;border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px}
.chip button{border:0;background:none;cursor:pointer;color:var(--sub);font-size:13px}
.panel input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;background:var(--ink);color:#fff}.btn.sub{background:#efebe3;color:var(--ink)}
.runs div{font-size:12.5px;margin:3px 0}.meta .br{font-weight:700;font-size:13px}.meta .dt{font-size:11px;color:var(--sub);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tag{background:var(--acc2);color:var(--acc);font-size:11px;padding:2px 7px;border-radius:6px}
.tag.p{background:#fff2d9;color:#8a5a00}.tag.r{background:#fde4e4;color:var(--c)}
.empty{padding:40px 24px;color:var(--sub)}
table{border-collapse:collapse;width:calc(100% - 48px);margin:10px 24px 40px;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#efebe3;font-size:12px;color:var(--sub)}
tr.click{cursor:pointer}tr.click:hover td{background:#faf8f4}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border-radius:16px;max-width:980px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.player{background:#111;min-height:420px;display:flex;flex-direction:column}
.player iframe{flex:1;border:0;width:100%;min-height:420px}
.player .sw{display:flex;gap:6px;padding:8px;flex-wrap:wrap}.player .sw button{font-size:12px;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.info{padding:18px 20px}.info h2{margin:0 0 4px;font-size:18px}
.info .row{font-size:13px;margin:10px 0}.info .row b{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;letter-spacing:.5px}
.info pre{white-space:pre-wrap;font-family:inherit;background:#f7f5f0;border-radius:8px;padding:10px;font-size:12.5px;margin:0;max-height:180px;overflow:auto}
.idea{background:var(--acc2);border-radius:10px;padding:10px 12px}
.close{position:sticky;top:0;float:right;border:0;background:none;font-size:22px;cursor:pointer}
a{color:var(--acc)}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:320px;text-align:center}
#lock input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;margin:14px 0 8px}
#lock button{width:100%;border:0;border-radius:8px;padding:10px;background:var(--ink);color:#fff;font-size:14px;cursor:pointer}
#lock .err{color:var(--c);font-size:12px;min-height:16px}
.claude{border:1px solid #d9cff7;border-radius:10px;padding:10px 12px;margin-top:12px}
.claude h3{margin:0 0 4px;font-size:13px;color:var(--acc)}
.search{display:flex;gap:8px;padding:4px 24px 6px}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--card)}
.search button{border:0;border-radius:10px;padding:0 16px;background:var(--acc);color:#fff;font-size:13px;cursor:pointer}
.qchips{padding:0 24px;font-size:12px;color:var(--sub)}
.tag.ch{background:#e6f3ea;color:#1f6b3a}.tag.cat{background:#eef1f6;color:#3a4a66}
.guess{color:var(--sub);font-weight:500}.guess.q{color:#b7791f}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.mini div{cursor:pointer;font-size:10.5px;color:var(--sub)}.mini .t{aspect-ratio:4/5;border-radius:8px;background:#ddd center/cover;margin-bottom:3px;position:relative}
.mini .t span{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 5px;font-size:10px}
.bp{padding:6px 24px 40px;display:grid;gap:14px}
.bp .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bp h2{margin:0;font-size:22px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpis div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--sub)}.kpis b{display:block;font-size:18px;color:var(--ink)}
.kwc{display:flex;flex-wrap:wrap;gap:6px}.kwc span{background:#f1ede5;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}.kwc span i{font-style:normal;color:var(--sub);margin-left:4px;font-size:11px}
.tl{display:grid;gap:8px}.tl .d{font-size:12px;font-weight:700;margin-top:4px}
.cloud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:center;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:160px}
.cloud span{cursor:pointer;line-height:1.15}.cloud span:hover{text-decoration:underline}
.per{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{color:#c0392b;font-weight:700}.dn{color:#2b6cb0}
.small{font-size:12px;color:var(--sub)}
.tbl-sm td,.tbl-sm th{padding:7px 9px}
.act button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer;margin-right:2px}
@media(max-width:720px){.report{grid-template-columns:repeat(2,1fr)}.box{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 12px 30px}
header,.report,.tabs,.filters,.search,.bp,.set,.qchips{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div id="lock"><form id="lockForm">
  <div style="font-size:32px">🕵️</div><b>광고 탐정 승규</b>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <label style="font-size:12px;color:#6f6a62"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
  <div class="err" id="err"></div>
  <button>수사 기록 열기</button>
</form></div>
<header>
  <h1>🕵️ 광고 탐정 승규<small>広告探偵スンギュ · META AD LIBRARY JP</small></h1>
  <div class="upd"><span id="upd"></span> · <a href="#" onclick="store.del('adpw');location.reload();return false">잠그기</a></div>
</header>

<section class="report" id="report"></section>

<form class="search" id="searchForm">
  <input id="q" placeholder="🔎 무엇이든 찾아보세요 — 예) 수분 광채 피부를 강조한 영상 광고, 메가와리 할인 카드뉴스">
  <button>찾기</button>
</form>
<div class="qchips" id="qinfo"></div>

<nav class="tabs">
  <button class="tab on" data-v="ads">🗂 전체 소재</button>
  <button class="tab" data-v="trend">📈 카피 트렌드</button>
  <button class="tab" data-v="partner">🤝 협력 광고</button>
  <button class="tab" data-v="brand">🏷 브랜드</button>
  <button class="tab" data-v="settings">⚙️ 수사 설정</button>
</nav>

<section class="filters" id="filters">
  <input id="fBrand" list="brandList" placeholder="브랜드 검색 (전체)" style="width:160px"><datalist id="brandList"></datalist>
  <select id="fSource"><option value="">전체 출처</option><option value="watch">⭐ 집중 감시</option><option value="brand">📋 일반 수집</option><option value="sweep">🔎 키워드 발굴</option></select>
  <select id="fStatus"><option value="">전체 상태</option><option value="on">게재 중</option><option value="off">종료</option><option value="new">오늘 신규</option><option value="winend">🏆 종료된 위닝</option></select>
  <label>최소 <input id="fDays" type="number" min="0" value="0" style="width:56px">일</label>
  <select id="fGrade"><option value="">모든 등급</option><option>A</option><option>B</option><option>C</option><option value="none">미분석</option></select>
  <select id="fType"><option value="">모든 유형</option><option value="video">🎬 영상</option><option value="image">🖼 이미지</option><option value="carousel">🗂 카드뉴스</option></select>
  <select id="fCat"><option value="">모든 카테고리</option></select>
  <select id="fCh"><option value="">모든 랜딩</option></select>
  <input id="fText" placeholder="문구·소구점 검색" style="width:140px">
  <label><input id="fPartner" type="checkbox"> 협력 광고만</label>
  <label><input id="fRisk" type="checkbox"> 약기법 주의 숨기기</label>
  <label title="숨김 처리한 브랜드도 함께 보기"><input id="fShowHidden" type="checkbox" onchange="SHOWHIDDEN=this.checked;refreshBrandList();render()"> 🙈 숨긴 브랜드 보기</label>
  <select id="fSort"><option value="days">게재일수순</option><option value="new">최신 발견순</option></select>
  <span class="count" id="count"></span>
</section>

<main id="view"></main>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
let D = null, VIEW = "ads", LIMIT = 120, TODAY = "", SHA = null, BRAND = null, AIQ = null, TREND = { unit: "week", off: 0 };
let SET = { watch: [], brands: [], keywords: [], blocked_pages: [], hidden: [], aliases: {} };
let SHOWHIDDEN = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qa = x => "decodeURIComponent(&quot;" + encodeURIComponent(x ?? "").replace(/'/g, "%27") + "&quot;)";
const CATS = ["클렌징", "토너·패드", "세럼·앰플", "크림", "마스크팩", "선케어", "메이크업", "디바이스", "바디·헤어", "이너뷰티"];

// ---------- 잠금 해제 ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} },
                del(k) { try { localStorage.removeItem(k); } catch {} } };
async function unlock(pw, remember) {
  let r = await fetch("data.enc.json?" + Date.now());
  if (!r.ok) {
    r = await fetch("data.json?" + Date.now());
    if (!r.ok) throw new Error("empty");
    D = await r.json();
  } else {
    D = await decrypt(await r.json(), pw);
  }
  if (remember) store.set("adpw", pw); else store.del("adpw");
  $("#lock").remove(); init();
}
$("#lockForm").onsubmit = e => {
  e.preventDefault(); $("#err").textContent = "확인 중...";
  unlock($("#pw").value, $("#remember").checked).catch(err =>
    $("#err").textContent = err.message === "empty" ? "아직 수사 기록이 없어요 (첫 실행 전)" : "비밀번호가 맞지 않아요");
};
if (store.get("adpw")) unlock(store.get("adpw"), true).catch(() => store.del("adpw"));

// ---------- 공통 ----------
const isTier = (a, t) => a.source === t;
function brandOf(a) {
  if (a.source === "watch" || a.source === "brand") return a.brand;
  return SET.aliases[a.page_name] || a.page_name || a.brand;
}
function guessOf(page) { return SET.aliases[page] ? null : (D.brand_guess || {})[page] || null; }
function brandLabel(a) {
  const b = brandOf(a), page = a.page_name || "";
  if (b && page && b !== page) return `${esc(page)} <span class="guess">(${esc(b)})</span>`;
  const g = guessOf(page);
  return g ? `${esc(page)} <span class="guess q" title="추측 — 브랜드 탭에서 ✔로 확정">(${esc(g)}?)</span>` : esc(b);
}
const tierIcon = a => a.source === "watch" ? "⭐ " : a.source === "brand" ? "📋 " : "";
const blockedSet = () => new Set(SET.blocked_pages.map(x => x.toLowerCase()));
const hiddenSet = () => new Set(SET.hidden || []);
function visibleAds(includeHidden = SHOWHIDDEN) {
  const b = blockedSet(), h = hiddenSet();
  return D.ads.filter(a => !b.has((a.page_name || "").toLowerCase()) && (includeHidden || !h.has(brandOf(a))));
}
const isHidden = name => hiddenSet().has(name);
function mtype(a) {
  if ((a.display_format || "").toUpperCase().includes("CAROUSEL") || (a.media_count || 0) > 1) return "carousel";
  return a.media_type === "video" ? "video" : "image";
}
const isWin = a => a.run_days >= D.winning_days;
const startOf = a => a.start_date || a.first_seen;
const pair = a => a.partner ? `${a.page_name} × ${a.partner}` : "";

async function init() {
  TODAY = D.today || D.updated;
  $("#upd").textContent = "마지막 수사: " + D.updated;
  await loadSettings();
  const s = D.summary;
  $("#report").innerHTML = `
    <div class="stat" data-q="new"><b>${s.new_today}</b><span>🆕 오늘 새로 뜬 소재</span></div>
    <div class="stat win" data-q="win"><b>${s.winning}</b><span>🏆 위닝 소재 (${D.winning_days}일+ 게재 중)</span></div>
    <div class="stat" data-q="off"><b>${s.ended_week}</b><span>🪦 최근 7일 종료</span></div>
    <div class="stat" data-q=""><b>${s.total}</b><span>📁 누적 수집 · 브랜드 ${s.brands ?? "-"}개</span></div>`;
  document.querySelectorAll(".stat").forEach(el => el.onclick = () => {
    const q = el.dataset.q; resetFilters();
    $("#fStatus").value = q === "win" ? "on" : q; $("#fDays").value = q === "win" ? D.winning_days : 0;
    AIQ = null; $("#qinfo").innerHTML = ""; setView("ads");
  });
  CATS.forEach(c => $("#fCat").insertAdjacentHTML("beforeend", `<option>${c}</option>`));
  [...new Set(D.ads.map(a => a.channel).filter(Boolean))].sort().forEach(c => $("#fCh").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
  refreshBrandList();
  document.querySelectorAll("#filters select, #filters input").forEach(el => el.oninput = () => { LIMIT = 120; render(); });
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.v));
  $("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
  document.onkeydown = e => { if (e.key === "Escape") closeModal(); };
  $("#searchForm").onsubmit = e => { e.preventDefault(); aiSearch($("#q").value); };
  render();
}
function refreshBrandList() {
  $("#brandList").innerHTML = [...new Set(visibleAds().map(brandOf))].sort().map(b => `<option value="${esc(b)}">`).join("");
}
function resetFilters() {
  ["#fBrand", "#fText"].forEach(k => $(k).value = "");
  ["#fSource", "#fStatus", "#fGrade", "#fType", "#fCat", "#fCh"].forEach(k => $(k).value = "");
  $("#fDays").value = 0; $("#fPartner").checked = false; $("#fRisk").checked = false;
}
function setView(v) {
  VIEW = v;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === v || (v === "brandpage" && t.dataset.v === "brand")));
  render(); window.scrollTo(0, 0);
}

// ---------- 전체 소재 ----------
function searchText(a) {
  const an = a.analysis || {};
  return [a.body, a.title, a.page_name, a.partner, brandOf(a), ...(a.keywords || []), ...(a.kw || []), ...(a.cats || []),
          ...(an.appeal_points || []), an.format, an.hook_3s, an.structure].join(" ").toLowerCase();
}
function filtered() {
  const b = $("#fBrand").value.trim().toLowerCase(), src = $("#fSource").value, st = $("#fStatus").value, days = +$("#fDays").value || 0,
        g = $("#fGrade").value, txt = $("#fText").value.trim().toLowerCase(), p = $("#fPartner").checked, risk = $("#fRisk").checked,
        ty = $("#fType").value, cat = $("#fCat").value, ch = $("#fCh").value;
  let r = visibleAds().filter(a =>
    (!ty || mtype(a) === ty) && (!cat || (a.cats || []).includes(cat)) && (!ch || a.channel === ch) &&
    (!b || brandOf(a).toLowerCase() === b || brandOf(a).toLowerCase().includes(b) || (a.page_name || "").toLowerCase().includes(b)) &&
    (!src || a.source === src) &&
    (!st || (st === "on" && a.is_active) || (st === "off" && !a.is_active) || (st === "new" && a.first_seen === TODAY)
         || (st === "winend" && !a.is_active && isWin(a))) &&
    a.run_days >= days &&
    (!g || (g === "none" ? !a.analysis : a.analysis?.grade === g)) &&
    (!p || a.partner) &&
    (!risk || !a.analysis || a.analysis.yakkiho_risk === "없음") &&
    (!txt || searchText(a).includes(txt)));
  if (AIQ) {     // AI 검색 결과: 점수순
    r = r.map(a => [a, aiScore(a)]).filter(x => x[1] > 0).sort((x, y) => y[1] - x[1] || y[0].run_days - x[0].run_days).map(x => x[0]);
    return r;
  }
  const key = $("#fSort").value;

const PC = [0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4];
function ham(x, y) { let d = 0; for (let i = 0; i < 16; i++) d += PC[parseInt(x[i], 16) ^ parseInt(y[i], 16)]; return d; }
function jac(a, b) { if (!a?.length || !b?.length) return 0; const s = new Set(a); let n = 0; b.forEach(x => s.has(x) && n++); return n / (a.length + b.length - n); }
function similar(a, n = 8) {
  const out = [];
  for (const o of visibleAds()) {
    if (o.id === a.id) continue;
    let img = 0, txt = 0;
    if (a.dhash && o.dhash) { const h = ham(a.dhash, o.dhash); if (h <= 12) img = 1 - h / 64; }
    txt = jac(a.kw, o.kw) + 0.3 * jac(a.analysis?.appeal_points, o.analysis?.appeal_points);
    const sc = Math.max(img, txt);
    if (sc >= 0.3) out.push([o, sc, img >= txt ? "🖼 이미지" : "📝 카피"]);
  }
  return out.sort((x, y) => y[1] - x[1]).slice(0, n);
}

// ---------- 카피 트렌드 ----------
function period(unit, off) {
  const d = new Date(TODAY + "T00:00:00");
  let s, e;
  if (unit === "day") { s = new Date(d); s.setDate(d.getDate() - off); e = new Date(s); }
  else if (unit === "week") { s = new Date(d); s.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7 * off); e = new Date(s); e.setDate(s.getDate() + 6); }
  else if (unit === "month") { s = new Date(d.getFullYear(), d.getMonth() - off, 1); e = new Date(d.getFullYear(), d.getMonth() - off + 1, 0); }
  else { s = new Date(d.getFullYear() - off, 0, 1); e = new Date(d.getFullYear() - off, 11, 31); }
  const f = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  return [f(s), f(e)];
}
function countKw(ads) { const c = {}; ads.forEach(a => new Set(a.kw || []).forEach(w => c[w] = (c[w] || 0) + 1)); return c; }

    <div class="panel"><h3>🔍 수사 시작</h3>
      <p>매일 08:37 전체 수사 + 13:07·18:07·22:07 ⚡ 빠른 수사(집중 감시만)가 자동으로 돌아요.</p>
      <div style="display:flex;gap:8px;margin:10px 0"><button class="btn" onclick="runNow('full')">🔍 전체 수사 시작</button><button class="btn sub" onclick="runNow('watch')">⚡ 빠른 수사 (집중 감시만)</button></div>
      <div class="runs" id="runs">${has ? "불러오는 중..." : ""}</div>
    </div>
    <div class="panel"><h3>⭐ 집중 감시 브랜드 (${SET.watch.length})</h3>
      <p>새 소재를 발견하는 즉시 원본까지 저장 + 하루 4번 빠른 수사.</p>
      <div class="chips">${SET.watch.map(w => chip(w.name + (w.page_id ? " · ID" : ""), `removeWatch(${qa(w.name)})`)).join("")}</div>
      <input id="wName" placeholder="브랜드명 (예: VT)" style="width:22%"> <input id="wPage" placeholder="(선택) 광고 라이브러리 링크 또는 페이지 ID" style="width:32%">
      <input id="wAlias" placeholder="(선택) 다른 표기·계정명, 쉼표로" style="width:26%">
      <button class="btn" onclick="addWatch($('#wName').value,$('#wPage').value,$('#wAlias').value)">추가</button>
    </div>
    <div class="panel"><h3>📋 일반 수집 브랜드 (${SET.brands.length})</h3>
      <p>키워드와 상관없이 이 브랜드 광고를 매일 수집해요. 원본은 14일 이상 살아남은 소재만 저장.</p>
      <div class="chips">${SET.brands.map(w => chip(w.name, `removeBrand(${qa(w.name)})`)).join("") || '<span class="small">아직 없음</span>'}</div>
      <input id="bName" placeholder="브랜드명" style="width:22%"> <input id="bPage" placeholder="(선택) 광고 라이브러리 링크 또는 페이지 ID" style="width:32%">
      <input id="bAlias" placeholder="(선택) 다른 표기·계정명, 쉼표로" style="width:26%">
      <button class="btn" onclick="addBrand($('#bName').value,'',$('#bPage').value,$('#bAlias').value)">추가</button>
    </div>
    <div class="panel"><h3>🏷 수집된 광고 계정 → 실제 브랜드</h3>
      <p>키워드로 발견된 계정이에요. ✏️ 실제 브랜드 지정 (같은 이름을 주면 합쳐져요) · ✔ 추측 확정 · ☆ 집중 감시 · 📋 일반 수집 · 🚫 차단</p>
      <input id="acq" placeholder="계정·브랜드 검색" oninput="renderAccounts()" style="width:40%"><div id="acc"></div>
    </div>
    <div class="panel"><h3>🔎 수집 키워드 (${SET.keywords.length})</h3>
      <p>이 검색어로 일본에서 광고하는 모든 광고주를 수집해요. 숫자는 최근 전체 수사에서 잡힌 일본어 광고 수.</p>
      <div class="chips">${SET.keywords.map(k => chip(k + (hits[k] !== undefined ? ` · ${hits[k]}` : ""), `removeKeyword(${qa(k)})`)).join("")}</div>
      <input id="kw" placeholder="새 키워드 (예: 美白)" onkeydown="if(event.key==='Enter')addKeyword(this.value)"> <button class="btn" onclick="addKeyword($('#kw').value)">추가</button>
    </div>
    <div class="panel"><h3>🙈 숨긴 브랜드 (${SET.hidden.length})</h3>
      <p>화면에서만 숨겨요. 수집과 원본 저장은 계속돼서 언제든 ✕로 다시 볼 수 있어요.</p>
      <div class="chips">${SET.hidden.map(b => chip(b, `toggleHide(${qa(b)})`)).join("") || '<span class="small">없음</span>'}</div>
    </div>
    <div class="panel"><h3>🚫 차단한 광고주 (${SET.blocked_pages.length})</h3>
      <p>수집하지 않고, 기존 소재와 드라이브 파일도 다음 수사 때 정리돼요. ✕ 누르면 차단 해제.</p>
      <div class="chips">${SET.blocked_pages.map(b => chip(b, `unblock(${qa(b)})`)).join("") || "<p>없음</p>"}</div>
    </div></div>`;
  renderAccounts(); showRuns();
}
</script>
</body>
</html>
