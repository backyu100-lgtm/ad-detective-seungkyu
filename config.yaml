# 🕵️ 광고 탐정 승규 (広告探偵スンギュ) 설정 파일
# 경쟁사를 추가/삭제하려면 competitors 목록만 고치면 됩니다.

country: JP              # 광고 라이브러리 국가 필터

competitors:
  # page_id(페이스북 페이지 숫자 ID)가 있으면 가장 정확합니다.
  # 모르면 keyword만 적어도 됩니다 → 검색 결과 중 page_names 와 이름이 맞는 광고만 수집.
  - name: 예시브랜드
    page_id: ""          # 예: "123456789012345"
    keyword: "예시브랜드"
    page_names: ["예시브랜드"]

# 셀로라바이 제품 정보 → AI가 "우리 제품 적용안"을 만들 때 기준으로 씀
celoraby:
  products:
    - name: "(주력 제품명)"
      appeal_points: ["(소구점1)", "(소구점2)"]

scrape:
  max_scrolls: 30        # 브랜드당 최대 스크롤 횟수 (광고가 많으면 늘리기)
  scroll_wait_sec: 2.5

analysis:
  model: "claude-sonnet-5-5"
  min_run_days: 14       # 이 일수 이상 게재된 소재만 AI 분석 (비용 절약)
  max_per_run: 30        # 하루 최대 분석 개수

report:
  winning_days: 30       # 이 일수 이상 게재 중이면 '위닝 소재'
