# 🕵️ 광고 탐정 승규 (広告探偵スンギュ) 설정 파일

country: JP              # 광고 라이브러리 국가 필터
ad_language: ja          # 광고 라이브러리 언어 필터 (끄려면 빈 값)
japanese_only: true      # 문구에 히라가나·가타카나가 없는 광고는 제외 (문구 없는 광고는 수집)

# 집중 감시 브랜드 / 수집 키워드 / 차단 광고주 목록은 docs/settings.json 에 있습니다
# (대시보드 ⚙️ 수사 설정 화면에서 추가·삭제)

# 키워드 발굴 옵션
sweeps:
  max_scrolls: 40              # 검색어당 스크롤 (늘리면 더 많이, 대신 오래 걸림)
  download_min_days: 14        # 이 일수 이상 게재된 소재만 원본 저장
  max_downloads_per_run: 300   # 하루 원본 저장 상한

# 셀로라바이 제품 정보 → AI가 "우리 제품 적용안"을 만들 때 기준으로 씀
celoraby:
  concept: "약국 코스메틱 (薬局コスメ) — 민감 피부에도 흔들림 없는 처방. 주 고객층 50대, 저비용 제작 선호"
  products:
    - name: "리투겔 ECM크림 (リトゥジェルECMクリーム) — 주력"
      appeal_points: ["바르는 스킨부스터", "PDRN 다음은 ECM", "진피 시술 성분 ECM 모사(ECM-5)",
                      "피부시술 리투오에서 착안", "Qoo10 랭킹 1위 다수", "민감 성분 없음·레티놀 병용 가능", "튜브형"]
    - name: "리투겔세럼 (リトゥジェルセラム)"
      appeal_points: ["ECM-X 콤플렉스", "ECM크림과 병용(세트)", "살짝 우윳빛 제형"]
    - name: "펜타샷 (ポテンションペンタショット) 미용 디바이스"
      appeal_points: ["모공 케어", "스킨케어 전 사용으로 흡수 도움"]

scrape:
  max_scrolls: 30        # 브랜드당 최대 스크롤 횟수 (광고가 많으면 늘리기)
  scroll_wait_sec: 2.5

analysis:
  provider: "gemini"     # gemini 또는 claude
  gemini_model: "gemini-flash-latest"   # 구글이 최신 Flash로 자동 교체해주는 별칭
  claude_model: "claude-sonnet-5-5"
  claude_deep_per_run: 10   # 위닝 소재 상위 N개는 Claude로 한 번 더 심층 분석 (ANTHROPIC_API_KEY 있을 때)
  min_run_days: 14       # 이 일수 이상 게재된 소재만 AI 분석 (비용 절약)
  max_per_run: 60        # 하루 최대 분석 개수 (Gemini 무료 등급 한도 내)

report:
  winning_days: 30       # 이 일수 이상 게재 중이면 '위닝 소재'
